[package]
name = "linkmarks-bridge-netscape"
description = "Bridge for the standard Netscape bookmark HTML interchange format (Firefox/Chrome/Edge export, Pinboard/Linkwarden/Shaarli import)."
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository = "https://github.com/LOUST-PRO/LinkMarks"
homepage = "https://loust-pro.github.io/LinkMarks/"
keywords = ["bookmarks", "netscape", "html", "export", "interchange"]
categories = ["encoding", "parser-implementations"]
readme = "README.md"

[dependencies]
linkmarks-core = { path = "../../linkmarks-core", version = "2.2.1" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true
quick-xml.workspace = true
tempfile.workspace = true
