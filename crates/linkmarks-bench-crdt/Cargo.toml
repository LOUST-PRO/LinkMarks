[package]
name = "linkmarks-bench-crdt"
version = "0.0.0"
edition = "2021"
rust-version = "1.78"
publish = false
description = "Benchmark suite comparing yrs vs automerge-rs under representative LinkMarks workloads (encode size, contention throughput, HTTP roundtrip)."
license = "AGPL-3.0-or-later"

# Workspace member. The benchmark binaries are excluded from `cargo install
# --path` (publish = false) but compiled as part of `cargo build --workspace`.
# They are large deps (yrs + automerge each ~5-10 MB of compiled code) so we
# keep the bench isolated from the user-shipped binaries in linkmarks-cli.

[lib]
name = "linkmarks_bench_crdt"
path = "src/lib.rs"

[[bin]]
name = "yrs-bench"
path = "src/bin/yrs-bench.rs"

[[bin]]
name = "automerge-bench"
path = "src/bin/automerge-bench.rs"

[[bin]]
name = "compare"
path = "src/bin/compare.rs"

[[bin]]
name = "compare-concurrent"
path = "src/bin/compare-concurrent.rs"

[[bin]]
name = "http_sync_server"
path = "src/bin/http_sync_server.rs"

[[bin]]
name = "http_sync_client"
path = "src/bin/http_sync_client.rs"

[dependencies]
# Reproducible fixture
rand = "0.8"
rand_chacha = "0.3"

# Mirror linkmarks-core shape — same dep versions as the main workspace
chrono = { version = "0.4", features = ["clock"] }
ulid = "3"

# CRDT candidates (yrs is the one used at the LinkMarks app layer)
yrs = "0.20"
automerge = "0.5"

# HTTP roundtrip suite (see src/bin/http_sync_server.rs + http_sync_client.rs)
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
