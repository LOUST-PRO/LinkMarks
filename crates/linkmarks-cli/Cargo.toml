[package]
name = "linkmarks-cli"
description = "Command-line interface for LinkMarks with deterministic subcommands, structured output formats, and shell completions."
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository = "https://github.com/LOUST-PRO/LinkMarks"
homepage = "https://github.com/LOUST-PRO/LinkMarks"
keywords = ["bookmarks", "cli", "clap", "local-first", "shell"]
categories = ["command-line-utilities", "database"]
readme = "README.md"

[dependencies]
linkmarks-core = { path = "../linkmarks-core", version = "2.2.0" }
linkmarks-tui = { path = "../linkmarks-tui", version = "2.2.0" }
linkmarks-bridge-chromium = { path = "../bridges/linkmarks-bridge-chromium", version = "2.2.0" }
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono.workspace = true
yrs = "0.20"

[dev-dependencies]
tempfile = "3"
