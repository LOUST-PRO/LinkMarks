# nginx vhost template for `relay.example.com`.
#
# This file lives in deploy/ in the LinkMarks repo. Operators copy it
# to /etc/nginx/sites-available/, fill in the placeholders, symlink
# to sites-enabled/, and `nginx -t && systemctl reload nginx`.
#
# Placeholders (search for `replace:`):
#   <DOMAIN>          public DNS (e.g. relay.example.com)
#   <VPS-IP>          the VPS's public IPv4 (used to avoid host_port collisions)

server {
        server_name <DOMAIN>;

        listen <VPS-IP>:443 ssl;
        listen <VPS-IP>:443 quic;
        http2 on;
        http3 on;

        ssl_certificate /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/<DOMAIN>/chain.pem;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Alt-Svc 'h3=":443"; ma=86400, h2=":443"; ma=86400' always;
        add_header Strict-Transport-Security "max-age=63072000" always;

        # The relay speaks on 127.0.0.1:8080 with axum + LZ4 compression.
        location / {
                proxy_pass http://127.0.0.1:8080;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                # LZ4 + gzip transport compression: the relay uses
                # tower-http::CompressionLayer with br,gzip,deflate,lz4.
                # Forward the Accept-Encoding header so compression kicks in.
                proxy_pass_request_headers on;
                proxy_buffering off;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
        }

        # Health probe — bypass logging to keep access.log small.
        location = /healthz {
                proxy_pass http://127.0.0.1:8080/healthz;
                access_log off;
        }

        # Readiness probe — different from liveness; returns 200 once
        # the relay has loaded the API key and the data dir.
        location = /readyz {
                proxy_pass http://127.0.0.1:8080/readyz;
                access_log off;
        }
}