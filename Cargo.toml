[workspace]
resolver = "2"
members = [
    "crates/linkmarks-core",
    "crates/linkmarks-cli",
    "crates/bridges/linkmarks-bridge-chromium",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.78"
license = "AGPL-3.0-or-later"
authors = ["David Alejandro Mireles Llamas"]
homepage = "https://github.com/LOUST-PRO/LinkMarks"
repository = "https://github.com/LOUST-PRO/LinkMarks"
keywords = ["bookmarks", "self-hosted", "local-first", "crdt", "rust"]
categories = ["command-line-utilities", "database", "web"]
description = "Local-first, AGPL-licensed bookmark manager. Imports what you have, dedupes deterministically, stays useful offline."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
tracing = "0.1"
walkdir = "2"
clap = { version = "4.6", features = ["derive"] }
linkmarks-core = { path = "crates/linkmarks-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
